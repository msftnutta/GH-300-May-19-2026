name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"
  WORKING_DIR: hello-app

jobs:
  # ---------------------------------------------------------------------------
  # Build, lint, and test the application
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # "Compilation" step — this project is plain JS (ESM), so we use
      # `node --check` on every source file as a syntax / parse gate.
      # Replace with `npm run build` if/when a real build step is added.
      - name: Compile (syntax check)
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-app-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/src
            ${{ env.WORKING_DIR }}/package.json
            ${{ env.WORKING_DIR }}/package-lock.json
          if-no-files-found: error
          retention-days: 7

